$font = Fira Code

general {
    hide_cursor = false
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/wallpapers/cow-facing-sea.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2

    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(255, 255, 255, 0.2)

    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    rounding = 24

    font_family = $font
    placeholder_text = Enter your password, Boss...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    position = 0, -2%
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $font

    position = 0, -18%
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 21
    font_family = $font

    position = 0, -30%
    halign = center
    valign = top
}
